name: AIBOX UAT Images

on:
  push:
    branches:
      - aibox-0.8-uat-20261017
    paths:
      - '.github/workflows/aibox-uat-images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/tevriqorg/aibox-weknora
  UAT_TAG: uat-70cbb15

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_FRONTEND_COMMIT=70cbb15
          tags: |
            ${{ env.IMAGE_PREFIX }}-ui:${{ env.UAT_TAG }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=aibox-uat-ui
          cache-to: type=gha,scope=aibox-uat-ui,mode=max

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version metadata
        id: version
        shell: bash
        run: |
          eval "$(./scripts/get_version.sh env)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit_id=$COMMIT_ID" >> "$GITHUB_OUTPUT"
          echo "build_time=$BUILD_TIME" >> "$GITHUB_OUTPUT"
          echo "go_version=$GO_VERSION" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile.app
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION_ARG=${{ steps.version.outputs.version }}
            COMMIT_ID_ARG=${{ steps.version.outputs.commit_id }}
            BUILD_TIME_ARG=${{ steps.version.outputs.build_time }}
            GO_VERSION_ARG=${{ steps.version.outputs.go_version }}
            WITH_ANYDOC=0
          tags: |
            ${{ env.IMAGE_PREFIX }}-app:${{ env.UAT_TAG }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=aibox-uat-app
          cache-to: type=gha,scope=aibox-uat-app,mode=max

  docreader:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk
        uses: jlumbroso/free-disk-space@main
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile.docreader
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-docreader:${{ env.UAT_TAG }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=aibox-uat-docreader
          cache-to: type=gha,scope=aibox-uat-docreader,mode=max
