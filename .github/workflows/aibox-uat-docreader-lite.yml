name: AIBOX UAT DocReader Lite

on:
  push:
    branches:
      - aibox-0.8-uat-20261017
    paths:
      - '.github/workflows/aibox-uat-docreader-lite.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docreader-lite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile.docreader-uat-lite
          platforms: linux/amd64
          push: true
          tags: ghcr.io/tevriqorg/aibox-weknora-docreader:uat-lite-70cbb15
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=aibox-uat-docreader-lite
          cache-to: type=gha,scope=aibox-uat-docreader-lite,mode=max
